<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project moved</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#07111f;color:#eaf4ff}main{width:min(680px,calc(100% - 48px));padding:40px;border:1px solid #24415f;border-radius:20px;background:#0d1b2b}p{color:#bed3e8;line-height:1.7}a{color:#8ed5ff;font-weight:700;word-break:break-all}</style></head>
<body><main><h1>This project has moved.</h1><p id="message">Preparing the current link…</p><p>You will be redirected in five seconds.</p></main>
<script>const p=location.pathname.replace(/^\/+|\/+$/g,'');const t=p?`https://abelchinjh.github.io/${p}/`:`https://github.com/abelchinjh`;document.getElementById('message').innerHTML=`Current location: <a href="${t}">${t}</a>`;setTimeout(()=>location.replace(t),5000)</script></body></html>
